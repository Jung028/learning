<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SwipeLearn new module</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6F4630}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5EDE3;color:#2B1A12;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:56px 20px 32px;gap:24px">

<div style="display:flex;align-items:center;justify-content:space-between">
<a href="Home.dc.html" aria-label="Close" style="width:44px;height:44px;border:1px solid #E0D2C0;border-radius:999px;background:#FFFBF6;color:#2B1A12;display:flex;align-items:center;justify-content:center;text-decoration:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<div style="font-size:13px;color:#6F5A4C">Step 1 of 2</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<h1 style="margin:0;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:32px;line-height:38px">What do you want to learn?</h1>
<p style="margin:0;font-size:16px;line-height:24px;color:#6F5A4C">Type anything. Claude builds a short course with a quiz after every chapter.</p>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<label for="topic" style="font-size:14px;font-weight:600">Topic</label>
<textarea id="topic" rows="3" style="box-sizing:border-box;width:100%;border:1px solid #E0D2C0;border-radius:14px;background:#FFFBF6;color:#2B1A12;font:400 18px/26px 'Inter',system-ui,sans-serif;padding:14px 16px;resize:none">Stoicism</textarea>
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<div style="font-size:14px;font-weight:600">Your level</div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
<button type="button" onClick="{{ l.pick }}" aria-pressed="{{ l.on }}" style="{{ l.style }}">{{ l.label }}</button>
</sc-for>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<div style="font-size:14px;font-weight:600">How many chapters</div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<sc-for list="{{depths}}" as="d" hint-placeholder-count="3">
<button type="button" onClick="{{ d.pick }}" aria-pressed="{{ d.on }}" style="{{ d.style }}">{{ d.label }}</button>
</sc-for>
</div>
<div style="font-size:13px;color:#6F5A4C">About 5 to 8 minutes per chapter, including the quiz.</div>
</div>

<div style="flex:1"></div>

<a href="Generating.dc.html" style="height:52px;border-radius:999px;background:#6F4630;box-shadow:0 6px 16px rgba(94,59,40,0.28);color:#FFFBF6;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none">Generate outline</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { level: 'Beginner', depth: '5 chapters' };
  }
  chipStyle(on) {
    return on
      ? "height:44px;padding:0 18px;border:2px solid #6F4630;border-radius:999px;background:#EADBC8;color:#4A2E1E;font:600 15px 'Inter',system-ui,sans-serif"
      : "height:44px;padding:0 18px;border:1px solid #E0D2C0;border-radius:999px;background:#FFFBF6;color:#2B1A12;font:500 15px 'Inter',system-ui,sans-serif";
  }
  renderVals() {
    const lv = ['Beginner', 'Intermediate', 'Advanced'];
    const dp = ['3 chapters', '5 chapters', '8 chapters'];
    return {
      levels: lv.map((label) => ({
        label,
        on: this.state.level === label,
        style: this.chipStyle(this.state.level === label),
        pick: () => this.setState({ level: label })
      })),
      depths: dp.map((label) => ({
        label,
        on: this.state.depth === label,
        style: this.chipStyle(this.state.depth === label),
        pick: () => this.setState({ depth: label })
      }))
    };
  }
}
</script>
</body>
</html>
