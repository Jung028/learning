<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SwipeLearn reader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6F4630}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#F5EDE3;color:#2B1A12;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:56px 20px 28px;gap:16px">

<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
<a href="Home.dc.html" aria-label="Close and save progress" style="width:44px;height:44px;border:1px solid #E0D2C0;border-radius:999px;background:#FFFBF6;color:#2B1A12;display:flex;align-items:center;justify-content:center;text-decoration:none;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<div style="flex:1;text-align:center;font-size:13px;line-height:18px;font-weight:500;color:#6F5A4C">Chapter 1 · Where it began<br>{{counter}}</div>
<button type="button" onClick="{{toggleSave}}" aria-label="Save card to Stash" aria-pressed="{{saved}}" style="width:44px;height:44px;border:1px solid #E0D2C0;border-radius:999px;background:#FFFBF6;color:#6F4630;display:flex;align-items:center;justify-content:center;flex:none">
<sc-if value="{{saved}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v16l-5-4-5 4z"/></svg></sc-if>
<sc-if value="{{notSaved}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B1A12" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v16l-5-4-5 4z"/></svg></sc-if>
</button>
</div>

<div style="height:8px;border-radius:999px;background:#E0D2C0;overflow:hidden"><div style="{{barStyle}}"></div></div>

<div onTouchStart="{{touchStart}}" onTouchEnd="{{touchEnd}}" style="flex:1;min-height:0;background:#FFFBF6;border:1px solid #E0D2C0;border-radius:32px;box-shadow:0 4px 20px rgba(43,26,18,0.08);padding:28px;display:flex;flex-direction:column;gap:16px;overflow:hidden">

<sc-if value="{{isReading}}" hint-placeholder-val="{{ true }}">
<div style="font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:64px;line-height:64px;color:#EADBC8" aria-hidden="true">{{card.num}}</div>
<div style="font-size:13px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#6F4630">{{card.kicker}}</div>
<h1 style="margin:0;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:28px;line-height:34px">{{card.title}}</h1>
<p style="margin:0;font-size:20px;line-height:30px">{{card.body}}</p>
<div style="flex:1"></div>
<div style="font-size:13px;color:#6F5A4C;display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>Swipe up for the next card</div>
</sc-if>

<sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
<div style="flex:1"></div>
<div style="width:56px;height:56px;border-radius:999px;background:#E5EFDD;color:#3F6B3A;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
<h1 style="margin:0;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:32px;line-height:38px">Chapter 1 read</h1>
<p style="margin:0;font-size:18px;line-height:28px;color:#6F5A4C">Now check what stuck. Five quick questions on what you just read.</p>
<div style="flex:1"></div>
<a href="Quiz.dc.html" style="height:52px;border-radius:999px;background:#6F4630;box-shadow:0 6px 16px rgba(94,59,40,0.28);color:#FFFBF6;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none">Take quiz</a>
<button type="button" onClick="{{restart}}" style="height:52px;border:0;border-radius:999px;background:#EADBC8;color:#4A2E1E;font:600 16px 'Inter',system-ui,sans-serif">Read the cards again</button>
</sc-if>

</div>

<sc-if value="{{isReading}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;align-items:center;justify-content:space-between">
<button type="button" onClick="{{prev}}" aria-label="Previous card" style="width:52px;height:52px;border:1px solid #E0D2C0;border-radius:999px;background:#FFFBF6;color:#2B1A12;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
<button type="button" onClick="{{openSheet}}" style="height:44px;padding:0 20px;border:0;border-radius:999px;background:#2B1A12;color:#FFFBF6;font:600 15px 'Inter',system-ui,sans-serif">Ask Claude</button>
<button type="button" onClick="{{next}}" aria-label="Next card" style="width:52px;height:52px;border:0;border-radius:999px;background:#6F4630;box-shadow:0 6px 16px rgba(94,59,40,0.28);color:#FFFBF6;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
</div>
</sc-if>

<sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(43,26,18,0.5)"></div>
<div role="dialog" aria-label="Ask Claude" style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;background:#FFFBF6;border-radius:32px 32px 0 0;padding:20px 20px 32px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;justify-content:space-between"><div style="font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:22px">Ask Claude</div>
<button type="button" onClick="{{closeSheet}}" aria-label="Close sheet" style="width:44px;height:44px;border:1px solid #E0D2C0;border-radius:999px;background:#FFFBF6;color:#2B1A12;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div style="font-size:13px;color:#6F5A4C">About: {{card.title}}</div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<button type="button" onClick="{{askSimpler}}" style="height:44px;padding:0 16px;border:0;border-radius:999px;background:#EADBC8;color:#4A2E1E;font:600 15px 'Inter',system-ui,sans-serif">Explain simpler</button>
<button type="button" onClick="{{askExample}}" style="height:44px;padding:0 16px;border:0;border-radius:999px;background:#EADBC8;color:#4A2E1E;font:600 15px 'Inter',system-ui,sans-serif">Give an example</button>
<button type="button" onClick="{{askQuestion}}" style="height:44px;padding:0 16px;border:0;border-radius:999px;background:#EADBC8;color:#4A2E1E;font:600 15px 'Inter',system-ui,sans-serif">Ask a question</button>
</div>
<div style="min-height:88px;box-sizing:border-box;border:1px solid #E0D2C0;border-radius:14px;background:#F5EDE3;padding:14px 16px;font-size:16px;line-height:24px">{{reply}}</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, saved: {}, sheet: false, reply: 'Pick an option and Claude answers in two or three sentences.', y0: null };
  }
  cards() {
    return [
      { num: '01', kicker: 'Where it began', title: 'A school under a porch', body: 'Stoicism began in Athens around 300 BCE. Its founder, Zeno of Citium, taught beneath a painted porch called the Stoa Poikile. The word “Stoic” comes from that porch.', simple: 'Stoicism started in Athens, and its name comes from the covered walkway where the first teacher spoke.', example: 'Like a lecture held in a public arcade where anyone walking past could stop and listen.' },
      { num: '02', kicker: 'The core idea', title: 'Control what you can', body: 'Epictetus taught that some things are up to us, like our opinions and choices. Others are not, like the weather or what people think of us. Spend your energy on the first group.', simple: 'Focus on what you can change. Let the rest go.', example: 'You can’t control a delayed train, but you can choose to use the wait to read.' },
      { num: '03', kicker: 'The goal', title: 'Character is the goal', body: 'Stoics believed good character, or virtue, is the only true good. Money, fame and comfort are fine to have, but they do not make a life good.', simple: 'Being a good person matters more than being rich or famous.', example: 'A Stoic would rather lose a deal than lie to win it.' },
      { num: '04', kicker: 'The teachers', title: 'Three voices to know', body: 'Seneca, a Roman statesman, wrote letters on living well. Epictetus, a former slave, taught in Greece. Marcus Aurelius, a Roman emperor, left us the Meditations.', simple: 'Three teachers: a writer, a former slave and an emperor.', example: 'Seneca’s letters read a bit like an advice column from the first century.' },
      { num: '05', kicker: 'The practice', title: 'Notes to himself', body: 'Marcus Aurelius never wrote Meditations for readers. They were private notes to himself, reminders to stay calm and act fairly while ruling an empire.', simple: 'The emperor wrote notes to himself to stay calm and fair.', example: 'Think of it as a private journal that was never meant to be published.' }
    ];
  }
  renderVals() {
    const cards = this.cards();
    const i = this.state.i;
    const done = i >= cards.length;
    const card = done ? cards[cards.length - 1] : cards[i];
    const saved = !!this.state.saved[i];
    const pct = done ? 100 : Math.round(((i + 1) / cards.length) * 100);
    return {
      card,
      isReading: !done,
      isDone: done,
      counter: done ? 'Complete' : 'Card ' + (i + 1) + ' of ' + cards.length,
      barStyle: 'height:8px;border-radius:999px;background:#6F4630;width:' + pct + '%',
      saved,
      notSaved: !saved,
      sheet: this.state.sheet,
      reply: this.state.reply,
      toggleSave: () => { const s = Object.assign({}, this.state.saved); s[i] = !s[i]; this.setState({ saved: s }); },
      next: () => { if (this.state.i < cards.length) this.setState({ i: this.state.i + 1 }); },
      prev: () => { if (this.state.i > 0) this.setState({ i: this.state.i - 1 }); },
      restart: () => this.setState({ i: 0 }),
      openSheet: () => this.setState({ sheet: true, reply: 'Pick an option and Claude answers in two or three sentences.' }),
      closeSheet: () => this.setState({ sheet: false }),
      askSimpler: () => this.setState({ reply: card.simple }),
      askExample: () => this.setState({ reply: card.example }),
      askQuestion: () => this.setState({ reply: 'Type any question here and Claude answers using only this chapter. (Typing is not part of the prototype.)' }),
      touchStart: (e) => { const t = e.touches && e.touches[0]; if (t) this.setState({ y0: t.clientY }); },
      touchEnd: (e) => {
        const t = e.changedTouches && e.changedTouches[0];
        if (!t || this.state.y0 == null) return;
        const dy = this.state.y0 - t.clientY;
        if (dy > 40 && this.state.i < cards.length) this.setState({ i: this.state.i + 1, y0: null });
        else if (dy < -40 && this.state.i > 0) this.setState({ i: this.state.i - 1, y0: null });
      }
    };
  }
}
</script>
</body>
</html>
