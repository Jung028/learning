<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SwipeLearn outline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6F4630}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5EDE3;color:#2B1A12;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:56px 20px 32px;gap:20px">

<div style="display:flex;align-items:center;justify-content:space-between">
<a href="Create.dc.html" aria-label="Back" style="width:44px;height:44px;border:1px solid #E0D2C0;border-radius:999px;background:#FFFBF6;color:#2B1A12;display:flex;align-items:center;justify-content:center;text-decoration:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<div style="font-size:13px;color:#6F5A4C">Step 2 of 2</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<h1 style="margin:0;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:32px;line-height:38px">Stoicism, in {{count}} chapters</h1>
<p style="margin:0;font-size:16px;line-height:24px;color:#6F5A4C">Beginner level · about 30 minutes. Remove chapters you do not need before you start, or regenerate for a fresh outline.</p>
</div>

<div style="display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;overflow:hidden">
<sc-for list="{{chapters}}" as="c" hint-placeholder-count="5">
<div style="display:flex;align-items:center;gap:12px;background:#FFFBF6;border:1px solid #E0D2C0;border-radius:16px;padding:12px 14px">
<div style="width:32px;height:32px;border-radius:999px;background:#EADBC8;color:#4A2E1E;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none">{{c.n}}</div>
<div style="flex:1;display:flex;flex-direction:column;gap:2px"><div style="font-size:16px;font-weight:600;line-height:22px">{{c.title}}</div><div style="font-size:13px;color:#6F5A4C">{{c.sub}}</div></div>
<button type="button" onClick="{{c.remove}}" aria-label="Remove chapter" style="width:44px;height:44px;border:0;border-radius:999px;background:transparent;color:#6F5A4C;display:flex;align-items:center;justify-content:center;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
</sc-for>
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<a href="Reader.dc.html" style="height:52px;border-radius:999px;background:#6F4630;box-shadow:0 6px 16px rgba(94,59,40,0.28);color:#FFFBF6;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none">Start chapter 1</a>
<a href="Outline.dc.html" style="height:52px;border-radius:999px;background:#EADBC8;color:#4A2E1E;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none">Regenerate outline</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { removed: [] };
  }
  renderVals() {
    const all = [
      { id: 1, title: 'Where it began' },
      { id: 2, title: 'Control what you can' },
      { id: 3, title: 'Character over comfort' },
      { id: 4, title: 'Daily Stoic practices' },
      { id: 5, title: 'Stoicism today' }
    ];
    const left = all.filter((c) => this.state.removed.indexOf(c.id) < 0);
    return {
      count: left.length,
      chapters: left.map((c, i) => ({ n: i + 1, title: c.title, sub: '5 cards · 5-question quiz', remove: () => { if (this.state.removed.length < all.length - 1) this.setState({ removed: this.state.removed.concat([c.id]) }); } }))
    };
  }
}
</script>
</body>
</html>
