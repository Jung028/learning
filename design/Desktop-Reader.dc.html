<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SwipeLearn desktop reader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6F4630}
</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:#F5EDE3;color:#2B1A12;font-family:'Inter',system-ui,sans-serif;display:flex;overflow:hidden">
<aside style="width:240px;flex:none;box-sizing:border-box;background:#FFFBF6;border-right:1px solid #E0D2C0;padding:28px 16px;display:flex;flex-direction:column;gap:24px">
<a href="Desktop-Home.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#2B1A12;padding:0 6px"><div style="width:36px;height:36px;border-radius:12px;background:#6F4630;color:#FFFBF6;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/></svg></div><span style="font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:20px">SwipeLearn</span></a>
<a href="Desktop-Create.dc.html" style="height:48px;border-radius:999px;background:#6F4630;box-shadow:0 6px 16px rgba(94,59,40,0.28);color:#FFFBF6;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New module</a>
<nav aria-label="Main" style="display:flex;flex-direction:column;gap:4px"><a href="Desktop-Home.dc.html" style="display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border-radius:999px;text-decoration:none;font-size:15px;font-weight:600;color:#4A2E1E;background:#EADBC8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home</a><a href="Desktop-Library.dc.html" style="display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border-radius:999px;text-decoration:none;font-size:15px;font-weight:500;color:#6F5A4C;background:transparent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M5 4h6v16H5zM13 4h6v16h-6z"/></svg>Library</a><a href="Desktop-Stash.dc.html" style="display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border-radius:999px;text-decoration:none;font-size:15px;font-weight:500;color:#6F5A4C;background:transparent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M7 4h10v16l-5-4-5 4z"/></svg>Stash</a><a href="Desktop-Settings.dc.html" style="display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border-radius:999px;text-decoration:none;font-size:15px;font-weight:500;color:#6F5A4C;background:transparent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>Settings</a></nav>
<div style="flex:1"></div>
<a href="Desktop-Home.dc.html" style="display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:#C98B4B;color:#2B1A12;font-size:14px;font-weight:600;text-decoration:none;align-self:flex-start"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg>4 days</a>
</aside>
<main style="flex:1;min-width:0;height:800px;box-sizing:border-box;overflow:hidden;padding:48px 56px">
<div style="display:flex;flex-direction:column;gap:20px;height:100%;max-width:1000px">
<div style="display:flex;align-items:center;justify-content:space-between"><a href="Desktop-Module.dc.html" style="display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:#6F4630;text-decoration:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Stoicism</a><div style="font-size:14px;color:#6F5A4C">{{counter}}</div></div>
<div style="height:8px;border-radius:999px;background:#E0D2C0;overflow:hidden"><div style="{{barStyle}}"></div></div>
<div style="flex:1;min-height:0;display:grid;grid-template-columns:1fr 280px;gap:24px">
<div style="background:#FFFBF6;border:1px solid #E0D2C0;border-radius:24px;box-shadow:0 2px 12px rgba(43,26,18,0.07);border-radius:32px;box-shadow:0 4px 20px rgba(43,26,18,0.08);padding:44px 56px;display:flex;flex-direction:column;gap:18px;overflow:hidden">
<sc-if value="{{isReading}}" hint-placeholder-val="{{ true }}">
<div style="font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:80px;line-height:80px;color:#EADBC8" aria-hidden="true">{{card.num}}</div>
<div style="font-size:14px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#6F4630">{{card.kicker}}</div>
<h1 style="margin:0;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:40px;line-height:46px">{{card.title}}</h1>
<p style="margin:0;font-size:22px;line-height:34px">{{card.body}}</p>
<div style="flex:1"></div>
<div style="font-size:13px;color:#6F5A4C">Use the buttons below to move between cards.</div>
</sc-if>
<sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
<div style="flex:1"></div>
<h1 style="margin:0;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:44px;line-height:50px">Chapter 1 read</h1>
<p style="margin:0;font-size:20px;line-height:30px;color:#6F5A4C">Now check what stuck. Five quick questions on what you just read.</p>
<div style="display:flex;gap:12px"><a href="Desktop-Quiz.dc.html" style="height:52px;padding:0 28px;border-radius:999px;background:#6F4630;box-shadow:0 6px 16px rgba(94,59,40,0.28);color:#FFFBF6;font:600 16px 'Inter',system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:0">Take quiz</a><button type="button" onClick="{{restart}}" style="height:52px;padding:0 28px;border-radius:999px;background:#EADBC8;color:#4A2E1E;font:600 16px 'Inter',system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:0">Read the cards again</button></div>
<div style="flex:1"></div>
</sc-if>
</div>
<div style="display:flex;flex-direction:column;gap:12px">
<button type="button" onClick="{{prev}}" style="height:44px;padding:0 20px;border-radius:999px;background:#EADBC8;color:#4A2E1E;border:0;font:600 15px 'Inter',system-ui,sans-serif">Previous card</button>
<button type="button" onClick="{{next}}" style="height:44px;padding:0 20px;border-radius:999px;background:#6F4630;box-shadow:0 6px 16px rgba(94,59,40,0.28);color:#FFFBF6;border:0;font:600 15px 'Inter',system-ui,sans-serif">Next card</button>
<button type="button" onClick="{{toggleSave}}" aria-pressed="{{saved}}" style="height:44px;padding:0 20px;border-radius:999px;background:#EADBC8;color:#4A2E1E;border:0;font:600 15px 'Inter',system-ui,sans-serif">{{saveLabel}}</button>
<button type="button" onClick="{{openSheet}}" style="height:44px;padding:0 20px;border-radius:999px;background:#EADBC8;color:#4A2E1E;border:0;font:600 15px 'Inter',system-ui,sans-serif">Ask Claude</button>
<sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
<div style="background:#FFFBF6;border:1px solid #E0D2C0;border-radius:24px;box-shadow:0 2px 12px rgba(43,26,18,0.07);padding:16px;display:flex;flex-direction:column;gap:10px">
<div style="font-size:14px;line-height:21px">{{reply}}</div>
<button type="button" onClick="{{askSimpler}}" style="height:44px;padding:0 20px;border-radius:999px;background:#EADBC8;color:#4A2E1E;border:0;font:600 15px 'Inter',system-ui,sans-serif;height:38px;font-size:14px">Explain simpler</button>
<button type="button" onClick="{{askExample}}" style="height:44px;padding:0 20px;border-radius:999px;background:#EADBC8;color:#4A2E1E;border:0;font:600 15px 'Inter',system-ui,sans-serif;height:38px;font-size:14px">Give an example</button>
<button type="button" onClick="{{askQuestion}}" style="height:44px;padding:0 20px;border-radius:999px;background:#EADBC8;color:#4A2E1E;border:0;font:600 15px 'Inter',system-ui,sans-serif;height:38px;font-size:14px">Ask my own question</button>
<button type="button" onClick="{{closeSheet}}" style="height:38px;border:0;background:transparent;color:#6F4630;font:600 14px 'Inter',system-ui,sans-serif">Close</button>
</div></sc-if>
</div></div></div>
</main>
</div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0, saved: {}, sheet: false, reply: 'Pick an option and Claude answers in two or three sentences.' }; }
  cards() {
    return [
      { num: '01', kicker: 'Where it began', title: 'A school under a porch', body: 'Stoicism began in Athens around 300 BCE. Its founder, Zeno of Citium, taught beneath a painted porch called the Stoa Poikile. The word “Stoic” comes from that porch.', simple: 'Stoicism is named after the porch where its first teacher spoke.', example: 'Like a school named after the cafe where it started.' },
      { num: '02', kicker: 'The core idea', title: 'Control what you can', body: 'Epictetus taught that some things are up to us, like our opinions and choices. Others are not, like the weather or what people think of us. Spend your energy on the first group.', simple: 'Worry only about what you can change.', example: 'You cannot control the rain, but you can bring an umbrella.' },
      { num: '03', kicker: 'The goal', title: 'Character is the goal', body: 'Stoics believed good character, or virtue, is the only true good. Money, fame and comfort are fine to have, but they do not make a life good.', simple: 'Being a good person matters more than being rich.', example: 'A kind teacher with little money, versus a rich person who is unfair.' },
      { num: '04', kicker: 'The teachers', title: 'Three voices to know', body: 'Seneca, a Roman statesman, wrote letters on living well. Epictetus, a former slave, taught in Greece. Marcus Aurelius, a Roman emperor, left us the Meditations.', simple: 'Three teachers: a writer, a teacher and an emperor.', example: 'Like a mentor, a coach and a boss who all gave you advice.' },
      { num: '05', kicker: 'The practice', title: 'Notes to himself', body: 'Marcus Aurelius never wrote Meditations for readers. They were private notes to himself, reminders to stay calm and act fairly while ruling an empire.', simple: 'The emperor wrote notes to remind himself to stay calm.', example: 'Like a sticky note on your mirror.' }
    ];
  }
  renderVals() {
    const cards = this.cards(); const i = this.state.i; const done = i >= cards.length;
    const card = done ? cards[cards.length - 1] : cards[i]; const saved = !!this.state.saved[i];
    const pct = done ? 100 : Math.round(((i + 1) / cards.length) * 100);
    return {
      card, isReading: !done, isDone: done,
      counter: done ? 'Complete' : 'Card ' + (i + 1) + ' of ' + cards.length,
      barStyle: 'height:8px;border-radius:999px;background:#6F4630;width:' + pct + '%',
      saved, notSaved: !saved, sheet: this.state.sheet, reply: this.state.reply,
      saveLabel: saved ? 'Saved to Stash' : 'Save to Stash',
      toggleSave: () => { const s = Object.assign({}, this.state.saved); s[i] = !s[i]; this.setState({ saved: s }); },
      next: () => { if (this.state.i < cards.length) this.setState({ i: this.state.i + 1 }); },
      prev: () => { if (this.state.i > 0) this.setState({ i: this.state.i - 1 }); },
      restart: () => this.setState({ i: 0 }),
      openSheet: () => this.setState({ sheet: true, reply: 'Pick an option and Claude answers in two or three sentences.' }),
      closeSheet: () => this.setState({ sheet: false }),
      askSimpler: () => this.setState({ reply: card.simple }),
      askExample: () => this.setState({ reply: card.example }),
      askQuestion: () => this.setState({ reply: 'Type any question here and Claude answers using only this chapter. (Typing is not part of the prototype.)' })
    };
  }
}
</script></x-dc>
</body>
</html>
